name: Flask DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests / Linter
      run: |
        echo "Running security checks and tests..."
        # Tambahkan perintah tes atau linter di sini jika ada

    - name: Build and Run Docker Container
      run: |
        # Hentikan container lama jika ada
        docker stop flask-app || true
        docker rm flask-app || true
        
        # Build image baru
        docker build -t flask-devsecops-app .
        
        # Jalankan container baru
        docker run -d --name flask-app -p 5000:5000 flask-devsecops-app
        
